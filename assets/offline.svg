<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Works in airplane mode. No internet permission.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E12"/><stop offset="1" stop-color="#0E1822"/></linearGradient>
<linearGradient id="ttl" x1="-1" y1="0" x2="0" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#39FF88"/><stop offset="0.5" stop-color="#fff"/><stop offset="1" stop-color="#5B8DEF"/><animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22303C" stroke-opacity="0.45"/></pattern>
<clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
